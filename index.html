<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraChat | أورا شات</title>
  <link rel="stylesheet" href="style.css">
  <!-- خط كايرو عشان الشياكة -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- صفحة تسجيل الدخول -->
<div class="auth-page" id="authPage">
  <div class="auth-box">
    <h1>AuraChat</h1>
    <input type="text" id="username" placeholder="اسم المستخدم">
    <input type="email" id="email" placeholder="البريد الإلكتروني">
    <input type="password" id="password" placeholder="كلمة المرور">
    <div class="auth-buttons">
        <button id="loginBtn" class="primary">دخول</button>
        <button id="signupBtn" class="secondary">إنشاء حساب</button>
    </div>
  </div>
</div>

<!-- تطبيق الشات الأساسي -->
<div class="chat-app" id="chatApp" style="display: none;">
  <button id="toggleSidebar" class="menu-btn">☰</button>
  
  <!-- القائمة الجانبية (الأصدقاء) -->
  <div class="sidebar">
    <div class="sidebar-top">
      <h2>المحادثات</h2>
      <button id="logoutBtn" class="logout-btn">خروج</button>
    </div>
    <input type="text" id="searchInput" placeholder="بحث عن مستخدم...">
    <div class="users-list" id="usersList"></div>
  </div>

  <!-- منطقة المحادثة -->
  <div class="chat-area">
    <div class="chat-top">
      <h3 id="chatUsername">اختر مستخدم لبدء الدردشة</h3>
    </div>

    <div class="messages" id="messages">
        <!-- الرسائل هتنزل هنا -->
    </div>

    <!-- زرار السكرول الذكي (مخفي وهيظهر بالـ JS) -->
    <button id="smart-scroll-btn" class="scroll-btn">↓</button>

    <div class="send-box">
        <label for="imageInput" class="attach-btn">📎</label>
        <input type="file" id="imageInput" accept="image/*" style="display: none;">
        <input type="text" id="messageInput" placeholder="اكتب رسالة...">
        <button id="sendBtn">إرسال</button>
    </div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
