<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AuraChat</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

<!-- LOGIN -->

<div class="auth-page" id="authPage">

  <div class="auth-box">

    <h1>AuraChat</h1>

    <input
      type="text"
      id="username"
      placeholder="Username"
    >

    <input
      type="email"
      id="email"
      placeholder="Email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button id="signupBtn">
      Create Account
    </button>

    <button id="loginBtn">
      Login
    </button>

  </div>

</div>

<!-- CHAT -->

<div class="chat-app" id="chatApp">
<button id="toggleSidebar" class="menu-btn">☰</button>
  <!-- SIDEBAR -->

  <div class="sidebar">

    <div class="sidebar-top">

      <h2>AuraChat</h2>

      <button id="logoutBtn">
        Logout
      </button>

    </div>

    <input
      type="text"
      id="searchInput"
      placeholder="Search username..."
    >

    <div
      class="users-list"
      id="usersList"
    ></div>

  </div>

  <!-- CHAT AREA -->

  <div class="chat-area">

    <div class="chat-top">

      <h3 id="chatUsername">
        Select a user
      </h3>

    </div>

    <div
      class="messages"
      id="messages"
    ></div>

    <div class="send-box">

  <input type="text" id="messageInput" placeholder="Type message...">

  <input type="file" id="imageInput" accept="image/*">

  <button id="sendBtn">Send</button>

    </div>

  </div>



<script type="module" src="app.js"></script>

</body>
</html>
